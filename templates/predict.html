<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự đoán bệnh tim</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        form {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="number"], select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="submit"] {
            background-color: #007BFF;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            font-size: 0.9em;
        }
        #result {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2 style="text-align: center;">Dự đoán Bệnh Tim</h2>

    <!-- Form gửi POST trực tiếp -->
    <form id="heartDiseaseForm" method="POST" action="/predict_heart">
        <label for="age">Tuổi:</label>
        <input type="number" id="age" name="age" required min="20" max="100">

        <label for="gender">Giới tính:</label>
        <select id="gender" name="gender">
            <option value="M">Nam</option>
            <option value="F">Nữ</option>
        </select>

        <label for="chest_pain_type">Loại đau ngực (1-4):</label>
        <input type="number" id="chest_pain_type" name="chest_pain_type" required min="1" max="4">

        <label for="resting_blood_pressure">Huyết áp nghỉ (mmHg):</label>
        <input type="number" id="resting_blood_pressure" name="resting_blood_pressure" required min="90" max="200">

        <label for="cholesterol">Cholesterol (mg/dl):</label>
        <input type="number" id="cholesterol" name="cholesterol" required min="100" max="600">

        <label for="max_heart_rate">Nhịp tim tối đa (bpm):</label>
        <input type="number" id="max_heart_rate" name="max_heart_rate" required min="60" max="200">

        <label for="exercise_angina">Đau thắt ngực khi vận động:</label>
        <select id="exercise_angina" name="exercise_angina">
            <option value="Y">Có</option>
            <option value="N">Không</option>
        </select>

        <label for="blood_sugar">Đường huyết:</label>
        <select id="blood_sugar" name="blood_sugar">
            <option value="1">Bình thường</option>
            <option value="2">Cao</option>
            <option value="3">Rất cao</option>
            <option value="4">Thấp</option>
        </select>

        <label for="shortness_of_breath">Khó thở:</label>
        <select id="shortness_of_breath" name="shortness_of_breath">
            <option value="1">Không</option>
            <option value="2">Vừa phải</option>
            <option value="3">Nghiêm trọng</option>
        </select>

        <label for="fatigue">Mệt mỏi:</label>
        <select id="fatigue" name="fatigue">
            <option value="1">Không bao giờ</option>
            <option value="2">Thỉnh thoảng</option>
            <option value="3">Thường xuyên</option>
        </select>

        <label for="dizziness">Chóng mặt:</label>
        <select id="dizziness" name="dizziness">
            <option value="1">Không bao giờ</option>
            <option value="2">Thỉnh thoảng</option>
            <option value="3">Thường xuyên</option>
        </select>

        <label for="chest_pain_frequency">Tần suất đau ngực (1-4):</label>
        <input type="number" id="chest_pain_frequency" name="chest_pain_frequency" required min="1" max="4">

        <label for="heart_rate_variability">Biến thiên nhịp tim (15-60):</label>
        <input type="number" id="heart_rate_variability" name="heart_rate_variability" required min="15" max="60">

        <label for="pulse_pressure">Áp lực mạch (30-80):</label>
        <input type="number" id="pulse_pressure" name="pulse_pressure" required min="30" max="80">

        <label for="ldl_hdl_ratio">Tỷ lệ LDL/HDL:</label>
        <input type="number" id="ldl_hdl_ratio" name="ldl_hdl_ratio" required min="1" max="5" step="0.1">

        <label for="stress_level">Mức độ stress (1-10):</label>
        <input type="number" id="stress_level" name="stress_level" required min="1" max="10">

        <label for="family_history">Tiền sử gia đình:</label>
        <select id="family_history" name="family_history">
            <option value="1">Có</option>
            <option value="2">Không</option>
        </select>

        <div id="error" class="error"></div>
        <input type="submit" value="Dự đoán">
    </form>

    <div id="result"></div>
</body>
</html>
